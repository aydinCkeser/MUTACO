[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "mutaco-graph"
version = "0.1.0.dev0"
description = "Audited Torch graph-simulator package for MUTACO"
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "mutaco==0.1.0.dev0",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "torch>=2.11,<2.13",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
